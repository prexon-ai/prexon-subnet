name: CPU checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.20"
          enable-cache: true
      - run: uv sync --frozen --extra api --extra miner --extra validator --extra datasets
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - run: uv build
      - run: uv run prexon-validator --check-config
      - run: uv run prexon-miner targets
      - run: uv run prexon-evaluate --help
      - run: uv run prexon-evaluate prepare-datasets --help
      - run: uv run python -m evaluation --help
