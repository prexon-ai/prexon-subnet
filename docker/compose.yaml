name: prexon-subnet
# Only the upload API runs in Docker. The validator runs on the host under pm2 and
# writes the upload policy into ../runtime/intake-policy, which the API reads.
services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    # The validator writes the policy with mode 0640, so run as the validator's user.
    user: "${API_CONTAINER_USER:?Set API_CONTAINER_USER to the validator user's uid:gid}"
    # Settings come from validator/config.py; the container receives only the two S3 keys.
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    # Every source must already exist: otherwise Docker would create it as a
    # root-owned directory. Restart the API after editing validator/config.py.
    volumes:
      - type: bind
        source: ../validator/config.py
        target: /app/validator/config.py
        read_only: true
        bind:
          create_host_path: false
      # A directory mount keeps the validator's atomic policy replacement visible.
      - type: bind
        source: ../runtime/intake-policy
        target: /app/runtime/intake-policy
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../runtime/api
        target: /app/runtime/api
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=4)
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
